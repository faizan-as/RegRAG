[project]
name = "fda-regulatory-copilot"
version = "0.1.0"
description = "Citation-first, AI-powered FDA Regulatory Intelligence Platform (MVP: hybrid RAG)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "llama-index-core>=0.11.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Retrieval
    "pgvector>=0.3.0",
    "opensearch-py>=2.7.0",
    "sentence-transformers>=3.0.0",
    # Ingestion
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.15.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # LLM providers
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    # Storage / metadata / auth
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "supabase>=2.7.0",
    "pyjwt>=2.9.0",
    # Reporting / export
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    # Observability / evaluation
    "langfuse>=2.44.0",
    "ragas>=0.1.0",
    # Utilities
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"apps/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
